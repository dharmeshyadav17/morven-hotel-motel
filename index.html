<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Soft Forms — Pastel Motion Graphics</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: Georgia, 'Times New Roman', serif;
    background: linear-gradient(180deg, #aeb9f2 0%, #f0dcf5 48%, #ffe6d2 100%);
  }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; cursor: grab; }
  .vignette {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 52%, rgba(96, 64, 128, 0.20) 100%);
  }
  .ui {
    position: fixed; top: 38px; left: 44px; pointer-events: none;
    color: #5d4a6e; animation: fadeDown 1.8s ease 0.3s both;
  }
  .ui h1 {
    font-size: clamp(26px, 4vw, 46px); font-weight: 400;
    letter-spacing: 0.38em; text-transform: uppercase;
  }
  .ui p {
    margin-top: 10px; font-style: italic;
    font-size: clamp(13px, 1.4vw, 16px);
    letter-spacing: 0.14em; opacity: 0.72;
  }
  .hint {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    pointer-events: none; color: #6a5578;
    font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase;
    animation: fadeUp 1.8s ease 0.9s both; white-space: nowrap;
  }
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translate(-50%, 16px); }
    to   { opacity: 0.75; transform: translate(-50%, 0); }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="app"></div>
<div class="vignette"></div>
<div class="ui">
  <h1>Soft Forms</h1>
  <p>a pastel dream in motion</p>
</div>
<div class="hint">drag to orbit &nbsp;·&nbsp; scroll to zoom &nbsp;·&nbsp; click the shapes</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ============================================================
   STATE — single consolidated object
   ============================================================ */
const state = {
  renderer: null, scene: null, camera: null, controls: null,
  clock: null, raycaster: null,
  pointer: new THREE.Vector2(-10, -10),
  downPos: { x: 0, y: 0 },
  floaties: [],
  burstPool: [],
  dust: null, dustSpeeds: null, dustCount: 0,
  blob: null, blobBase: null,
  hovered: null,
  intro: 0, introDone: false,
  assets: { pastelMats: [], geos: {}, tex: {} }
};

/* ============================================================
   HELPERS
   ============================================================ */
function rand(min, max) { return min + Math.random() * (max - min); }
function easeOutCubic(x) { return 1 - Math.pow(1 - x, 3); }

function makeDotTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(0.4, 'rgba(255,255,255,0.55)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
}

function makePastel(color) {
  return new THREE.MeshPhysicalMaterial({
    color: color,
    roughness: 0.3,
    metalness: 0.0,
    clearcoat: 1.0,
    clearcoatRoughness: 0.35,
    sheen: 0.5,
    sheenRoughness: 0.6,
    sheenColor: new THREE.Color(0xffffff),
    envMapIntensity: 0.55
  });
}

/* ============================================================
   RENDERER / SCENE / CAMERA / CONTROLS
   ============================================================ */
function initRenderer() {
  const r = new THREE.WebGLRenderer({ antialias: true });
  r.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  r.setSize(window.innerWidth, window.innerHeight);
  r.shadowMap.enabled = true;
  r.shadowMap.type = THREE.PCFSoftShadowMap;
  r.toneMapping = THREE.ACESFilmicToneMapping;
  r.toneMappingExposure = 1.1;
  document.getElementById('app').appendChild(r.domElement);
  state.renderer = r;
}

function initScene() {
  const s = new THREE.Scene();
  s.fog = new THREE.Fog(0xf2dfee, 16, 38);
  state.scene = s;

  const cam = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 140);
  cam.position.set(0, 5.5, 17);
  state.camera = cam;

  const controls = new OrbitControls(cam, state.renderer.domElement);
  controls.target.set(0, 1.6, 0);
  controls.enableDamping = true;
  controls.dampingFactor = 0.06;
  controls.minDistance = 5;
  controls.maxDistance = 20;
  controls.maxPolarAngle = Math.PI * 0.55;
  controls.autoRotate = false;
  controls.autoRotateSpeed = 0.7;
  controls.enabled = false;
  state.controls = controls;

  state.raycaster = new THREE.Raycaster();
  state.clock = new THREE.Clock();
}

/* ============================================================
   LIGHTING & ENVIRONMENT
   ============================================================ */
function initLights() {
  const s = state.scene;
  s.add(new THREE.HemisphereLight(0xe6dcff, 0xffe2cc, 0.7));

  const key = new THREE.DirectionalLight(0xffffff, 1.5);
  key.position.set(6, 10, 7);
  key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  key.shadow.camera.near = 1;
  key.shadow.camera.far = 30;
  key.shadow.camera.left = -8;
  key.shadow.camera.right = 8;
  key.shadow.camera.top = 8;
  key.shadow.camera.bottom = -8;
  key.shadow.bias = -0.0004;
  key.shadow.radius = 5;
  s.add(key);

  const rim = new THREE.DirectionalLight(0xffc9e3, 0.8);
  rim.position.set(-7, 5, -7);
  s.add(rim);

  const fill = new THREE.DirectionalLight(0xc9e4ff, 0.45);
  fill.position.set(-5, 3, 7);
  s.add(fill);

  const pmrem = new THREE.PMREMGenerator(state.renderer);
  const env = pmrem.fromScene(new RoomEnvironment(), 0.04);
  state.scene.environment = env.texture;
  pmrem.dispose();
}

/* ============================================================
   MATERIALS / GEOMETRIES / TEXTURES — centralized assets
   ============================================================ */
function initAssets() {
  const A = state.assets;
  A.pastelMats = [
    makePastel(0xffb9d6), // pink
    makePastel(0xc6b6ff), // lavender
    makePastel(0xb2efdc), // mint
    makePastel(0xffe9cf), // cream
    makePastel(0xffc9ae), // peach
    makePastel(0xbfdcff)  // sky
  ];
  A.geos.blob    = new THREE.SphereGeometry(1, 72, 72);
  A.geos.knot    = new THREE.TorusKnotGeometry(0.5, 0.16, 220, 32);
  A.geos.sphere  = new THREE.SphereGeometry(0.55, 48, 48);
  A.geos.torus   = new THREE.TorusGeometry(0.55, 0.24, 32, 72);
  A.geos.capsule = new THREE.CapsuleGeometry(0.26, 0.55, 8, 24);
  A.geos.bubble  = new THREE.SphereGeometry(0.3, 32, 32);
  A.geos.platform= new THREE.CylinderGeometry(3.6, 3.95, 0.35, 72);
  A.geos.ring    = new THREE.TorusGeometry(3.6, 0.05, 16, 120);
  A.geos.ground  = new THREE.CircleGeometry(45, 64);
  A.geos.spark   = new THREE.SphereGeometry(0.06, 10, 10);
  A.tex.dot      = makeDotTexture();
}

/* ============================================================
   GENERATION & ASSEMBLY
   ============================================================ */
function buildSky() {
  const geo = new THREE.SphereGeometry(70, 32, 32);
  const mat = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    depthWrite: false,
    uniforms: {
      topColor: { value: new THREE.Color(0xaeb9f2) },
      midColor: { value: new THREE.Color(0xf0dcf5) },
      botColor: { value: new THREE.Color(0xffe6d2) }
    },
    vertexShader: `
      varying vec3 vWorld;
      void main() {
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vWorld = wp.xyz;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      uniform vec3 topColor;
      uniform vec3 midColor;
      uniform vec3 botColor;
      varying vec3 vWorld;
      void main() {
        float h = normalize(vWorld).y;
        vec3 col = h > 0.0
          ? mix(midColor, topColor, pow(h, 0.75))
          : mix(midColor, botColor, pow(-h, 0.65));
        gl_FragColor = vec4(col, 1.0);
      }
    `
  });
  state.scene.add(new THREE.Mesh(geo, mat));
}

function addFloaty(mesh, opts) {
  const u = mesh.userData;
  u.baseY = opts.y;
  u.amp = opts.amp !== undefined ? opts.amp : 0.15;
  u.speed = opts.speed !== undefined ? opts.speed : 0.8;
  u.phase = opts.phase !== undefined ? opts.phase : 0;
  u.rotSpeed = opts.rotSpeed !== undefined ? opts.rotSpeed : 0.3;
  u.rotSpeedX = opts.rotSpeedX || 0;
  u.baseScale = opts.scale !== undefined ? opts.scale : 1;
  u.curScale = u.baseScale;
  u.pop = 0;
  u.colorIndex = opts.colorIndex || 0;
  mesh.position.set(opts.x, opts.y, opts.z || 0);
  if (opts.rx) mesh.rotation.x = opts.rx;
  if (opts.rz) mesh.rotation.z = opts.rz;
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  state.scene.add(mesh);
  state.floaties.push(mesh);
  return mesh;
}

function buildWorld() {
  const A = state.assets;
  const M = A.pastelMats;

  const platform = new THREE.Mesh(A.geos.platform, M[3]);
  platform.position.y = -0.175;
  platform.receiveShadow = true;
  state.scene.add(platform);

  const ring = new THREE.Mesh(A.geos.ring, M[0]);
  ring.rotation.x = Math.PI / 2;
  ring.position.y = 0;
  state.scene.add(ring);

  const ground = new THREE.Mesh(
    A.geos.ground,
    new THREE.ShadowMaterial({ opacity: 0.13 })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -0.36;
  ground.receiveShadow = true;
  state.scene.add(ground);

  // central squishy blob
  state.blobBase = A.geos.blob.attributes.position.array.slice();
  const blob = new THREE.Mesh(A.geos.blob, M[0]);
  addFloaty(blob, { x: 0, y: 1.32, z: 0, scale: 1.18, amp: 0.1, speed: 0.7, phase: 0, rotSpeed: 0.15, colorIndex: 0 });
  state.blob = blob;

  addFloaty(new THREE.Mesh(A.geos.knot, M[1]),    { x: -2.7, y: 2.5,  z: -0.7, scale: 1,    amp: 0.22, speed: 0.6, phase: 1.3, rotSpeed: 0.4,  rotSpeedX: 0.25, colorIndex: 1 });
  addFloaty(new THREE.Mesh(A.geos.sphere, M[2]),  { x: 2.6,  y: 1.7,  z: 0.6,  scale: 1,    amp: 0.18, speed: 0.9, phase: 2.1, rotSpeed: 0.2,  colorIndex: 2 });
  addFloaty(new THREE.Mesh(A.geos.torus, M[4]),   { x: 2.0,  y: 3.3,  z: -1.5, scale: 1,    amp: 0.2,  speed: 0.7, phase: 0.6, rotSpeed: 0.35, rotSpeedX: 0.4, rx: 0.5, colorIndex: 4 });
  addFloaty(new THREE.Mesh(A.geos.capsule, M[3]), { x: -2.1, y: 1.0,  z: 1.4,  scale: 1,    amp: 0.14, speed: 1.0, phase: 3.4, rotSpeed: 0.3,  rz: 0.7, colorIndex: 3 });
  addFloaty(new THREE.Mesh(A.geos.bubble, M[5]),  { x: 1.0,  y: 0.85, z: 1.7,  scale: 1,    amp: 0.2,  speed: 1.2, phase: 4.2, rotSpeed: 0.1,  colorIndex: 5 });
  addFloaty(new THREE.Mesh(A.geos.bubble, M[0]),  { x: -1.3, y: 3.6,  z: -0.6, scale: 0.8,  amp: 0.24, speed: 0.9, phase: 5.1, rotSpeed: 0.15, colorIndex: 0 });
  addFloaty(new THREE.Mesh(A.geos.sphere, M[1]),  { x: 3.4,  y: 2.6,  z: 1.2,  scale: 0.55, amp: 0.2,  speed: 1.1, phase: 2.8, rotSpeed: 0.25, colorIndex: 1 });

  buildDust();
  buildBurstPool();
}

function buildDust() {
  const count = 160;
  const positions = new Float32Array(count * 3);
  const speeds = new Float32Array(count);
  for (let i = 0; i < count; i++) {
    const r = 3 + Math.random() * 9;
    const a = Math.random() * Math.PI * 2;
    positions[i * 3]     = Math.cos(a) * r;
    positions[i * 3 + 1] = Math.random() * 9;
    positions[i * 3 + 2] = Math.sin(a) * r;
    speeds[i] = 0.1 + Math.random() * 0.25;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const mat = new THREE.PointsMaterial({
    size: 0.12, map: state.assets.tex.dot, transparent: true,
    opacity: 0.55, depthWrite: false, color: 0xffffff
  });
  state.dust = new THREE.Points(geo, mat);
  state.dustSpeeds = speeds;
  state.dustCount = count;
  state.scene.add(state.dust);
}

function buildBurstPool() {
  const M = state.assets.pastelMats;
  for (let i = 0; i < 90; i++) {
    const m = new THREE.Mesh(state.assets.geos.spark, M[i % M.length]);
    m.visible = false;
    state.scene.add(m);
    state.burstPool.push({
      mesh: m, vel: new THREE.Vector3(),
      life: 0, maxLife: 1, baseScale: 1
    });
  }
}

/* ============================================================
   ANIMATION
   ============================================================ */
function updateIntro(dt) {
  if (state.introDone) return;
  state.intro = Math.min(state.intro + dt / 2.2, 1);
  const k = easeOutCubic(state.intro);
  const r = THREE.MathUtils.lerp(17, 10.5, k);
  const y = THREE.MathUtils.lerp(5.5, 2.6, k);
  state.camera.position.set(0, y, r);
  state.camera.lookAt(0, 1.6, 0);
  if (state.intro >= 1) {
    state.introDone = true;
    state.controls.enabled = true;
    state.controls.autoRotate = true;
  }
}

function updateFloaties(t, dt) {
  for (const f of state.floaties) {
    const u = f.userData;
    f.position.y = u.baseY + Math.sin(t * u.speed + u.phase) * u.amp;
    f.rotation.y += u.rotSpeed * dt;
    f.rotation.x += u.rotSpeedX * dt;
    const target = (state.hovered === f) ? u.baseScale * 1.14 : u.baseScale;
    u.curScale += (target - u.curScale) * Math.min(dt * 8, 1);
    u.pop = Math.max(0, u.pop - dt * 3);
    f.scale.setScalar(u.curScale * (1 + u.pop * 0.22));
  }
}

function updateBlob(t) {
  const geo = state.assets.geos.blob;
  const pos = geo.attributes.position;
  const base = state.blobBase;
  for (let i = 0; i < pos.count; i++) {
    const i3 = i * 3;
    const x = base[i3], y = base[i3 + 1], z = base[i3 + 2];
    const w = Math.sin(x * 2.4 + t * 1.3) * Math.cos(y * 2.1 + t * 1.0) * Math.sin(z * 2.6 + t * 0.8);
    const d = 1 + w * 0.07;
    pos.setXYZ(i, x * d, y * d, z * d);
  }
  pos.needsUpdate = true;
  geo.computeVertexNormals();
}

function updateDust(dt, t) {
  const pos = state.dust.geometry.attributes.position;
  const arr = pos.array;
  for (let i = 0; i < state.dustCount; i++) {
    const i3 = i * 3;
    arr[i3 + 1] += state.dustSpeeds[i] * dt;
    if (arr[i3 + 1] > 9) arr[i3 + 1] = 0;
    arr[i3] += Math.sin(t * 0.4 + i * 1.7) * 0.0012;
  }
  pos.needsUpdate = true;
}

function updateBurst(dt) {
  for (const p of state.burstPool) {
    if (p.life <= 0) continue;
    p.life -= dt;
    p.vel.y -= 4.5 * dt;
    p.mesh.position.addScaledVector(p.vel, dt);
    const k = Math.max(p.life / p.maxLife, 0);
    p.mesh.scale.setScalar(Math.max(k, 0.001) * p.baseScale);
    p.mesh.rotation.x += dt * 3;
    p.mesh.rotation.y += dt * 2;
    if (p.life <= 0) p.mesh.visible = false;
  }
}

function updateHover() {
  state.raycaster.setFromCamera(state.pointer, state.camera);
  const hits = state.raycaster.intersectObjects(state.floaties, false);
  const h = hits.length ? hits[0].object : null;
  if (h !== state.hovered) {
    state.hovered = h;
    state.renderer.domElement.style.cursor = h ? 'pointer' : 'grab';
  }
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(state.clock.getDelta(), 0.05);
  const t = state.clock.elapsedTime;

  updateIntro(dt);
  updateFloaties(t, dt);
  updateBlob(t);
  updateDust(dt, t);
  updateBurst(dt);
  updateHover();

  state.controls.update();
  state.renderer.render(state.scene, state.camera);
}

/* ============================================================
   INTERACTION
   ============================================================ */
function burst(pos) {
  const M = state.assets.pastelMats;
  let count = 0;
  for (const p of state.burstPool) {
    if (p.life > 0) continue;
    p.life = p.maxLife = 0.7 + Math.random() * 0.5;
    p.mesh.visible = true;
    p.mesh.material = M[Math.floor(Math.random() * M.length)];
    p.mesh.position.copy(pos);
    p.vel.set((Math.random() - 0.5) * 2.4, Math.random() * 2.2 + 0.8, (Math.random() - 0.5) * 2.4);
    p.baseScale = 0.6 + Math.random() * 0.9;
    p.mesh.scale.setScalar(p.baseScale);
    if (++count >= 16) break;
  }
}

function onPointerMove(e) {
  state.pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
  state.pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
}

function onPointerDown(e) {
  state.downPos.x = e.clientX;
  state.downPos.y = e.clientY;
}

function onPointerUp(e) {
  const dx = e.clientX - state.downPos.x;
  const dy = e.clientY - state.downPos.y;
  if (dx * dx + dy * dy > 36) return;
  state.raycaster.setFromCamera(state.pointer, state.camera);
  const hits = state.raycaster.intersectObjects(state.floaties, false);
  if (hits.length) {
    const obj = hits[0].object;
    burst(hits[0].point);
    obj.userData.pop = 1;
    const u = obj.userData;
    u.colorIndex = (u.colorIndex + 1) % state.assets.pastelMats.length;
    obj.material = state.assets.pastelMats[u.colorIndex];
  }
}

function onResize() {
  state.camera.aspect = window.innerWidth / window.innerHeight;
  state.camera.updateProjectionMatrix();
  state.renderer.setSize(window.innerWidth, window.innerHeight);
}

function bindEvents() {
  window.addEventListener('resize', onResize);
  window.addEventListener('pointermove', onPointerMove);
  window.addEventListener('pointerdown', onPointerDown);
  window.addEventListener('pointerup', onPointerUp);
}

/* ============================================================
   INIT & START
   ============================================================ */
function init() {
  initRenderer();
  initScene();
  initLights();
  initAssets();
  buildSky();
  buildWorld();
  bindEvents();
}

init();
animate();
</script>
</body>
</html>
